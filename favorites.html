<!DOCTYPE html>
<html lang="en" data-theme="battery">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="assets/laptop-1.svg" type="image/svg+xml" />
    <title>Favorites - Student Laptop Finder</title>
    <script src="src/js/theme-init.js"></script>
    <link rel="stylesheet" href="dist/output.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="site-header-inner">
        <a href="index.html" class="brand">
          <span class="brand-mark">LF</span>
          <span class="hidden sm:inline">Laptop Finder</span>
        </a>

        <nav id="mainNav" class="site-nav order-3 md:order-2" aria-label="Main navigation">
          <a href="index.html" class="nav-link">Home</a>
          <a href="laptops.html" class="nav-link">Catalogue</a>
          <a href="favorites.html" class="nav-link nav-link-active">
            Favorites (<span id="favCount">0</span>)
          </a>
          <a href="compare.html" class="nav-link">Compare</a>
        </nav>

        <div class="ml-auto flex items-center gap-2 md:order-3 md:ml-0">
          <button id="themeButton" type="button" class="btn-quiet" aria-label="Switch color theme">
            Performance
          </button>
          <button
            id="navToggle"
            type="button"
            class="btn-quiet md:hidden"
            aria-controls="mainNav"
            aria-expanded="false"
          >
            Menu
          </button>
        </div>
      </div>
    </header>

    <main class="page-wrap">
      <div class="flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
        <div>
          <h1 class="text-3xl font-bold">Your favorites</h1>
          <p class="section-text">Laptops you saved on this device.</p>
        </div>
        <button id="clearButton" type="button" class="btn-quiet hidden">
          Clear all favorites
        </button>
      </div>

      <div id="favoritesSummary" class="mt-6"></div>

      <div
        id="favoritesList"
        class="mt-6 grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3"
      ></div>
    </main>

    <footer class="site-footer">
      <div class="site-footer-inner">
        <p>Student Laptop Finder</p>
        <p>SW302 User Interface Development, Assignment 2</p>
      </div>
    </footer>

    <script type="module" src="src/js/favorites.js"></script>
  </body>
</html>
