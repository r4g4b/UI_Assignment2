<!DOCTYPE html>
<html lang="en" data-theme="battery">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="assets/laptop-1.svg" type="image/svg+xml" />
    <title>Catalogue - Student Laptop Finder</title>
    <script src="src/js/theme-init.js"></script>
    <link rel="stylesheet" href="dist/output.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="site-header-inner">
        <a href="index.html" class="brand">
          <span class="brand-mark">LF</span>
          <span class="hidden sm:inline">Laptop Finder</span>
        </a>

        <nav id="mainNav" class="site-nav order-3 md:order-2" aria-label="Main navigation">
          <a href="index.html" class="nav-link">Home</a>
          <a href="laptops.html" class="nav-link nav-link-active">Catalogue</a>
          <a href="favorites.html" class="nav-link">Favorites (<span id="favCount">0</span>)</a>
          <a href="compare.html" class="nav-link">Compare</a>
        </nav>

        <div class="ml-auto flex items-center gap-2 md:order-3 md:ml-0">
          <button id="themeButton" type="button" class="btn-quiet" aria-label="Switch color theme">
            Performance
          </button>
          <button
            id="navToggle"
            type="button"
            class="btn-quiet md:hidden"
            aria-controls="mainNav"
            aria-expanded="false"
          >
            Menu
          </button>
        </div>
      </div>
    </header>

    <main class="page-wrap">
      <div class="flex flex-wrap items-end justify-between gap-3">
        <div>
          <h1 class="text-3xl font-bold">Laptop catalogue</h1>
          <p class="section-text">Search, filter and sort every laptop.</p>
        </div>
        <a href="favorites.html" class="btn-quiet">View favorites</a>
      </div>

      <section class="panel mt-6">
        <div class="grid grid-cols-1 gap-4 md:grid-cols-2 lg:grid-cols-4">
          <div class="md:col-span-2">
            <label for="searchInput" class="field-label">Search</label>
            <input
              id="searchInput"
              type="search"
              class="field"
              placeholder="Search by name or brand"
            />
          </div>

          <div>
            <label for="categoryFilter" class="field-label">Category</label>
            <select id="categoryFilter" class="field">
              <option value="all">All categories</option>
              <option value="ultrabook">Ultrabook</option>
              <option value="gaming">Gaming</option>
              <option value="2-in-1">2-in-1</option>
              <option value="creator">Creator</option>
              <option value="budget">Budget</option>
            </select>
          </div>

          <div>
            <label for="maxPriceFilter" class="field-label">
              Maximum price: <span id="maxPriceLabel">$2000</span>
            </label>
            <input
              id="maxPriceFilter"
              type="range"
              min="400"
              max="2000"
              step="50"
              value="2000"
              class="w-full accent-brand"
            />
          </div>

          <div>
            <label for="ramFilter" class="field-label">Minimum RAM</label>
            <select id="ramFilter" class="field">
              <option value="0">Any RAM</option>
              <option value="8">8 GB or more</option>
              <option value="16">16 GB or more</option>
              <option value="32">32 GB or more</option>
            </select>
          </div>

          <div>
            <label for="sortFilter" class="field-label">Sort by</label>
            <select id="sortFilter" class="field">
              <option value="price-asc">Price: low to high</option>
              <option value="price-desc">Price: high to low</option>
              <option value="battery-desc">Battery: high to low</option>
              <option value="battery-asc">Battery: low to high</option>
              <option value="weight-asc">Weight: light to heavy</option>
              <option value="weight-desc">Weight: heavy to light</option>
            </select>
          </div>
        </div>
      </section>

      <div class="mt-6 flex flex-wrap items-center justify-between gap-3">
        <p id="resultCount" class="text-sm font-semibold text-muted">0 laptops found</p>
        <p class="text-sm text-muted">Results update as you type.</p>
      </div>

      <div
        id="laptopGrid"
        class="mt-4 grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3"
      ></div>
    </main>

    <footer class="site-footer">
      <div class="site-footer-inner">
        <p>Student Laptop Finder</p>
        <p>SW302 User Interface Development, Assignment 2</p>
      </div>
    </footer>

    <script type="module" src="src/js/catalogue.js"></script>
  </body>
</html>
